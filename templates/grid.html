{% extends "base.html" %}

{% block mainbody %}

<div id = grid>
<table>

    {% for row in range(rowcount) %}
        <tr>
            {% for col in range(colcount) %}
                <td>
                    {% include "snippet.html" %}
                </td>
            {% endfor %}
        </tr>
    {% endfor %}
</table>

<!--
Source - https://stackoverflow.com/a/47610447
Posted by Michel Fernandes, modified by community. See post 'Timeline' for change history
Retrieved 2026-11-12, License - CC BY-SA 3.0
-->
{% if gameover == True %}
    <p><a href = "click.html">You Lost! Click here to get score!</a></p>   
{% else %}
    <p>{{message}}</p>
{% endif %}

    
</div>


<div
    hx-post="/keypress"
    hx-trigger="keyup[key=='ArrowLeft' || key=='ArrowRight'] from:body"
    hx-vals="js:{ keyPressed: event.key }"
    hx-target="#grid" >
</div>

<div
    hx-post="/update_grid"
    hx-trigger="every 1s"
    hx-target="#grid"
    hx-swap="innerHTML">
</div>


{% endblock %}
