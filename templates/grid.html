{% extends "base.html" %}

{% block mainbody %}

<div id = grid>
<table>

    {% for row in range(rowcount) %}
        <tr>
            {% for col in range(colcount) %}
                <td>
                    {% include "snippet.html" %}
                </td>
            {% endfor %}
        </tr>
    {% endfor %}
</table>

{{message}}
</div>


<div
    hx-post="/keypress"
    hx-trigger="keyup[key=='ArrowLeft' || key=='ArrowRight'] from:body"
    hx-vals="js:{ keyPressed: event.key }"
    hx-target="#grid" >
</div>

<div
    hx-post="/update_grid"
    hx-trigger="every 1s"
    hx-target="#grid"
    hx-swap="innerHTML">
</div>


{% endblock %}
